name: Prepare test runtime
description: Start the isolated runner's Azurite Table service and LocalDB instance for the .NET tests.
runs:
  using: composite
  steps:
    - name: Start Azurite
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $data = Join-Path $env:RUNNER_TEMP 'azurite'
        New-Item -ItemType Directory -Force -Path $data | Out-Null
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -property installationPath
        $azurite = Join-Path $vs 'Common7\IDE\Extensions\Microsoft\Azure Storage Emulator\azurite.exe'
        if (-not (Test-Path -LiteralPath $azurite)) {
          npm install --global azurite@3.37.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Azurite installation failed.' }
          $azurite = (Get-Command azurite-table.cmd -ErrorAction Stop).Source
        }
        Start-Process -FilePath $azurite -ArgumentList @('--silent', '--location', $data, '--tableHost', '127.0.0.1', '--tablePort', '10002', '--skipApiVersionCheck') -WindowStyle Hidden
        $deadline = (Get-Date).AddSeconds(60)
        while ($true) {
          try {
            $probe = [Net.Sockets.TcpClient]::new()
            $probe.Connect('127.0.0.1', 10002)
            $probe.Dispose()
            break
          }
          catch {
            if ((Get-Date) -gt $deadline) { throw 'Azurite did not start listening on 127.0.0.1:10002.' }
            Start-Sleep -Seconds 2
          }
        }
    # LocalDB's first start on a fresh runner is slow and sometimes fails for good; start it here, retrying with a new
    # instance, so the tests never pay for it one connection timeout at a time. CopilotCostCollectorSqlTests puts its
    # database files next to the test binaries, so that folder moves with LocalDB's files when a disk's sectors are too
    # large for SQL Server (#855).
    - name: Start LocalDB
      shell: pwsh
      run: |
        & (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Start-LocalDb.ps1') -Recreate `
          -DatabaseFolder (Join-Path $env:GITHUB_WORKSPACE 'src/AnalyticsEngine/Tests.UnitTests/bin/Release')
