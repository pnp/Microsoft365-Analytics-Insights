name: Secret scan

# Defense-in-depth secret scanning with gitleaks, on top of GitHub's native secret scanning +
# push protection. Catches generic/high-entropy secrets that the native provider-pattern scanner
# misses, and gates pull requests.
#
# NOTE ON TOOLING: this runs the gitleaks *binary* directly rather than `gitleaks/gitleaks-action@v2`.
# That action requires a paid `GITLEAKS_LICENSE` for repositories owned by an *organization* (this repo
# is under the `pnp` org), so the action would fail the check with a licensing error. The binary is the
# same MIT-licensed scanner with no such restriction. If a `GITLEAKS_LICENSE` org/repo secret is ever
# added, this can be swapped for the action.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from that release's gitleaks_${GITLEAKS_VERSION}_checksums.txt.
          # Update both together.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 5 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          cd "$RUNNER_TEMP"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commits introduced by this ref for secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            base_sha="$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA")"
            head_sha="$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$BEFORE_SHA"
            head_sha="$GITHUB_SHA"
          else
            git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            base_sha="$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA")"
            head_sha="$GITHUB_SHA"
            if [[ "$base_sha" == "$head_sha" ]]; then
              base_sha="$(git rev-parse "${head_sha}^")"
            fi
          fi

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not determine a valid commit range to scan." >&2
            exit 1
          fi

          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          gitleaks git . --redact --config .gitleaks.toml --log-opts "$base_sha..$head_sha"
