name: Secret scan

# Defense-in-depth secret scanning with gitleaks, on top of GitHub's native secret scanning +
# push protection. Catches generic/high-entropy secrets that the native provider-pattern scanner
# misses, and gates pull requests.
#
# NOTE ON TOOLING: this runs the gitleaks *binary* directly rather than `gitleaks/gitleaks-action@v2`.
# That action requires a paid `GITLEAKS_LICENSE` for repositories owned by an *organization* (this repo
# is under the `pnp` org), so the action would fail the check with a licensing error. The binary is the
# same MIT-licensed scanner with no such restriction. If a `GITLEAKS_LICENSE` org/repo secret is ever
# added, this can be swapped for the action.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commit history for secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gitleaks git . --redact --config .gitleaks.toml
