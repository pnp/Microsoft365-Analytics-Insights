name: Telemetry Service

# Build, test and deploy the maintainer-side telemetry dashboard (src/TelemetryService).
#
# Deliberately separate from ci.yml / pr.yml / tests.yml: those build the .NET Framework
# AnalyticsEngine solution on Windows and publish GitHub releases, whereas this is a .NET 10
# web app (hosted on Windows App Service) that deploys straight to App Service. The build itself
# runs on Linux: the published output is framework-dependent and portable, web.config included.

on:
  # Main keeps continuous delivery. Manual runs are build-only unless a deployment is selected.
  push:
    branches:
      - main
    paths:
      - src/TelemetryService/**
      - src/AnalyticsEngine/Common/UsageReporting/**
      - .github/workflows/telemetry-service.yml
      - .github/scripts/telemetry-deployment*
      - .nvmrc
  pull_request:
    branches:
      - main
      - dev
    paths:
      - src/TelemetryService/**
      - src/AnalyticsEngine/Common/UsageReporting/**
      - .github/workflows/telemetry-service.yml
      - .github/scripts/telemetry-deployment*
      - .nvmrc
  workflow_dispatch:
    inputs:
      deployment:
        description: Explicit deployment target (none only builds and tests)
        type: choice
        options: [none, development, production]
        default: none

# Least privilege by default. id-token is needed by azure/login for OIDC (no stored credentials).
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SERVICE_DIR: src/TelemetryService
  CLIENT_DIR: src/TelemetryService/web.client

# A newer push supersedes an in-flight run for the same branch, but never cancel a deploy
# that is already under way.
concurrency:
  group: telemetry-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment: ${{ steps.target.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The Node major is pinned repo-wide in the root .nvmrc so this workflow, the release build
      # and a developer machine all agree. It used to carry its own '22.x', which drifted from the
      # rest of the repo the moment either side moved.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Validate deployment intent
        id: target
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          DEPLOYMENT: ${{ inputs.deployment || 'none' }}
        run: node .github/scripts/telemetry-deployment.mjs target >> "$GITHUB_OUTPUT"

      # ---- Client -------------------------------------------------------------------
      - name: Install client dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci

      - name: Lint client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run lint

      - name: Test client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm test -- --coverage

      # ---- Server -------------------------------------------------------------------
      - name: Restore server
        run: dotnet restore ${{ env.SERVICE_DIR }}/Web.Server/Web.Server.csproj

      - name: Test server
        run: >
          dotnet test ${{ env.SERVICE_DIR }}/Tests.Unit/Tests.Unit.csproj
          --configuration Release
          --logger "trx;LogFileName=telemetry-tests.trx"
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload test results
        # Results are most useful precisely when the tests failed.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: telemetry-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

      # ---- Package ------------------------------------------------------------------
      # `dotnet publish` also builds the Vite client via the esproj reference and drops it into
      # wwwroot, so this single artifact is the whole deployable site.
      - name: Publish
        run: >
          dotnet publish ${{ env.SERVICE_DIR }}/Web.Server/Web.Server.csproj
          --configuration Release
          --output ${{ runner.temp }}/publish

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: telemetry-site
          path: ${{ runner.temp }}/publish
          if-no-files-found: error

  deploy:
    name: Deploy to App Service
    needs: build_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never deploy from a fork or from a pull request - only from pushes to this repository, and
    # only from the branches that represent a deployable state.
    if: >
      github.repository == 'pnp/Microsoft365-Analytics-Insights'
      && needs.build_and_test.outputs.deployment != 'none'
      && needs.build_and_test.outputs.deployment != ''
    permissions:
      contents: read
      id-token: write # OIDC federated credential for azure/login
    environment:
      name: ${{ needs.build_and_test.outputs.deployment == 'development' && 'telemetry-service-dev' || 'telemetry-service' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    concurrency:
      group: telemetry-deploy-${{ needs.build_and_test.outputs.deployment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require an isolated configured destination
        id: destination
        env:
          DEPLOYMENT: ${{ needs.build_and_test.outputs.deployment }}
          PRODUCTION_APP: ${{ vars.TELEMETRY_APP_NAME }}
          PRODUCTION_GROUP: ${{ vars.TELEMETRY_RESOURCE_GROUP }}
          DEVELOPMENT_APP: ${{ vars.TELEMETRY_DEV_APP_NAME }}
          DEVELOPMENT_GROUP: ${{ vars.TELEMETRY_DEV_RESOURCE_GROUP }}
        run: node .github/scripts/telemetry-deployment.mjs resource >> "$GITHUB_OUTPUT"
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: telemetry-site
          path: publish

      # Federated (OIDC) sign-in: no client secret is stored anywhere. The app registration used
      # here needs a federated credential for this repository and environment, plus Contributor
      # (or Website Contributor) on the target App Service.
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ steps.destination.outputs.app }}
          resource-group-name: ${{ steps.destination.outputs.group }}
          package: publish

      # The site is anonymous-friendly on /health, so this is a genuine end-to-end check that the
      # deployed build actually starts - not just that the deployment API returned success.
      - name: Verify health
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/health"
          echo "Checking $url"
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after $attempt attempt(s)."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code - retrying in 15s"
            sleep 15
          done
          echo "::error::Site did not report healthy after deployment."
          exit 1

      - name: Azure logout
        if: always()
        run: az logout || true
