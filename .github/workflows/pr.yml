name: PR build

on:
  pull_request:
    # The net10 branch has no XML configuration and builds on the .NET 10 SDK; its own
    # workflow (net10.yml) covers it. Running this .NET Framework pipeline against it would fail
    # on the App.config/Web.config transforms this file still performs.
    branches-ignore:
      - net10
    # See issue #270: `ready_for_review` on its own never fires for a PR opened directly as
    # non-draft (that emits `opened`), so this build simply never ran for most pull requests.
    # `synchronize` also gets the artifacts rebuilt when new commits are pushed.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # Unlike tests.yml this workflow is NOT a required status check, so keeping the path filter
    # is safe - a PR that never triggers it is not blocked by its absence.
    paths:
      - src/AnalyticsEngine/**
      - src/SPO/**
      - reports/**
      - build/**
      - .nvmrc
      - .github/ci-paths.json
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/build-packages.yml
    secrets: inherit
