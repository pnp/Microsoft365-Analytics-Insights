name: PR build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/AnalyticsEngine/**
      - src/SPO/**
      - reports/**
      - build/**
      - .nvmrc
      - .github/ci-paths.json
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/build-packages.yml
    secrets: inherit
