name: net10 build

# Builds and tests the .NET 10 port on the `net10` branch.
#
# Deliberately a SEPARATE workflow from ci.yml / tests.yml rather than extra branches on those:
#
#   - ci.yml is the customer release pipeline; it publishes the zips that become GitHub release
#     assets. Nothing on `net10` may ever reach that path, so the two are kept physically apart and
#     this workflow publishes no artifacts.
#
#   - tests.yml owns the REQUIRED status checks (`test_dotnet (Release)`, `test_aitracker`). Adding
#     branches or matrix legs there would change those check names and block PRs on dev/main - the
#     exact failure mode seen in issue #270.
#
# The branch is a long-lived mirror of the stable release, so the schedule trigger matters as much as
# the push one: `net10` rots when `main` moves, not when someone commits here.

on:
  push:
    branches:
      - net10
    paths:
      - src/AnalyticsEngine/**
      - infra/ContainerAppsDemo/**
      - .github/workflows/net10.yml
  pull_request:
    branches:
      - net10
  schedule:
    # Monday morning, to surface drift from main before the week's work starts.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The same configuration tests.yml supplies. Without it the integration tests cannot reach their
# fakes or services and fail in bulk, which would make this workflow permanently red and therefore
# ignored. The same secrets are passed; nothing new is exposed.
#
# They are plain environment variables here, where tests.yml substitutes them into App.Release.config
# first. This branch has no XML configuration at all: `AnalyticsConfig` reads environment variables as
# its highest-precedence source, so a secret reaches the test the moment the runner exports it.
#
# Note the two shapes. An APP SETTING is its own name (`ClientID`). A CONNECTION STRING is
# `ConnectionStrings__<name>` - the standard .NET double-underscore section separator, because
# `GetConnectionString("Storage")` reads the key `ConnectionStrings:Storage`. That is not a CI-only
# convention: it is the same key Azure App Service produces from the `CUSTOMCONNSTR_`/`SQLAZURECONNSTR_`
# variables it injects for the connection strings the installer writes, so CI and production agree.
env:
  ClientID: ${{ secrets.APP_CLIENTID }}
  ClientSecret: ${{ secrets.APP_CLIENTSECRET }}
  TenantGUID: ${{ secrets.APP_TENANTGUID }}
  TenantDomain: ${{ secrets.APP_TENANTDOMAIN }}
  CognitiveEndpoint: ${{ secrets.APP_COGNITIVEENDPOINT }}
  CognitiveKey: ${{ secrets.APP_COGNITIVEKEY }}
  CosmosDbTestContainerCurrent: stats
  CosmosDbTestContainerHistory: history
  CosmosDbTestDatabaseName: UnitTestDevOps
  CosmosDb: ${{ secrets.APP_COSMOSDB }}
  ConnectionStrings__Redis: "localhost:6379,abortConnect=False"
  ConnectionStrings__ServiceBus: ${{ secrets.CONNECTIONSTRINGS_SERVICEBUS }}
  ConnectionStrings__Storage: ${{ secrets.CONNECTIONSTRINGS_STORAGE }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # How far behind main are we? Runs on every trigger, including the weekly schedule.
  #
  # This is the job that protects the branch's whole reason for existing: a parallel branch nobody
  # syncs is worse than no branch, and the sync is cheap only while the divergence is small.
  # ---------------------------------------------------------------------------------------------
  drift_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          # Full history: we need to count commits between two branches.
          fetch-depth: 0

      - name: Measure divergence from main
        shell: bash
        env:
          # Fail past this many commits behind. Generous on purpose: the value that matters is the
          # number appearing in the summary every week, not the red X.
          MAX_BEHIND: 75
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          behind=$(git rev-list --count HEAD..origin/main)
          ahead=$(git rev-list --count origin/main..HEAD)

          {
            echo "## net10 divergence from main"
            echo ""
            echo "| | commits |"
            echo "|---|---|"
            echo "| Behind main | **${behind}** |"
            echo "| Ahead of main (the port itself) | ${ahead} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$behind" -eq 0 ]; then
            echo "In step with main." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "\`net10\` is **${behind}** commit(s) behind \`main\`. Sync it:"
              echo ""
              echo '```'
              echo "git fetch origin && git switch net10 && git merge origin/main"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "behind=${behind} ahead=${ahead}"
          if [ "$behind" -gt "$MAX_BEHIND" ]; then
            echo "::error::net10 is ${behind} commits behind main (threshold ${MAX_BEHIND}). Merge main into net10."
            exit 1
          elif [ "$behind" -gt 0 ]; then
            echo "::warning::net10 is ${behind} commits behind main."
          fi

  # ---------------------------------------------------------------------------------------------
  # The Container Apps demo image (infra/ContainerAppsDemo): the web app and the demo generator
  # built for LINUX with -p:AnalyticsTargetOS=linux (src/AnalyticsEngine/Directory.Build.props).
  #
  # Nothing else in this workflow compiles on Linux, so a Windows-only habit - a resx path whose case
  # differs from the file on disk, a new Windows Forms dependency, a partial class that relies on the
  # file order Windows happens to glob - would otherwise first surface as a failed demo deployment.
  # The context is staged from `git ls-files` exactly as Deploy-ContainerAppsDemo.ps1 stages it.
  # ---------------------------------------------------------------------------------------------
  demo_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Build the demo image
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/demo-context"
          mkdir -p "$context"
          git ls-files -z --cached --others --exclude-standard -- .nvmrc build src/AnalyticsEngine ':(glob)src/*.sql' \
            | xargs -0 cp --parents -t "$context"
          cp infra/ContainerAppsDemo/Dockerfile "$context/Dockerfile"
          docker build --build-arg "NODE_VERSION=$(grep -oE '[0-9]+' .nvmrc | head -n 1)" -t m365analytics-demo:ci "$context"

      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          # The generator runs end to end on Linux; --preview streams every row without SQL.
          docker run --rm m365analytics-demo:ci /app/datagen/Tests.FakeDataGen.dll demo --preview --users 50 --days 31

          # The web app starts and serves the portal's static bundle. Placeholder settings only:
          # nothing here signs in or reaches a database.
          docker run -d --name portal -p 8080:8080 \
            -e ClientID=00000000-0000-0000-0000-000000000000 -e ClientSecret=unused \
            -e TenantGUID=00000000-0000-0000-0000-000000000000 -e WebAppURL=https://portal.contoso.example \
            -e 'ConnectionStrings__SPOInsightsEntities=Server=tcp:contoso.database.windows.net;Database=ContosoDemo_Ci;Authentication=Active Directory Managed Identity' \
            -e 'ConnectionStrings__Storage=UseDevelopmentStorage=true' \
            m365analytics-demo:ci
          asset=$(docker exec portal sh -c 'ls /app/web/wwwroot/assets/*.js | head -n 1 | xargs basename')
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:8080/assets/$asset"; then
              echo "Portal served /assets/$asset"
              docker rm -f portal > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs portal
          exit 1

  # ---------------------------------------------------------------------------------------------
  # Build every .NET 10 project and run the unit test suite.
  # ---------------------------------------------------------------------------------------------
  build_and_test:
    # windows-latest rather than the windows-2022 pin tests.yml uses: that pin exists for a
    # hardcoded vstest.console.exe path under VS2022, and this workflow uses `dotnet test` instead.
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # Web.csproj shells out to npm to build the portal SPA, so this job is an npm consumer even
      # though nothing here mentions npm. Pinned from the repo-root .nvmrc, as every other npm step
      # in the repo does - never hardcoded.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/AnalyticsEngine/Web/Scripts/portal/package-lock.json

      # The tests that touch SQL use LocalDB, which the windows runner image already provides.
      - name: Start LocalDB
        shell: pwsh
        run: |
          & sqllocaldb create MSSQLLocalDB -s 2>&1 | Out-Host
          & sqllocaldb info MSSQLLocalDB | Out-Host

      - name: Build the .NET 10 projects
        shell: pwsh
        run: |
          $projects = @(
            'Common\DataUtils\DataUtils.csproj'
            'Common\UsageReporting\UsageReporting.csproj'
            'Common\CloudInstallEngine\CloudInstallEngine.csproj'
            'Common\Entities\Entities.csproj'
            'WebJob.AppInsightsImporter.Engine\WebJob.AppInsightsImporter.Engine.csproj'
            'WebJob.Office365ActivityImporter.Engine\WebJob.Office365ActivityImporter.Engine.csproj'
            'WebJob.AppInsightsImporter\WebJob.AppInsightsImporter.csproj'
            'WebJob.Office365ActivityImporter\WebJob.Office365ActivityImporter.csproj'
            'App.ControlPanel.Engine\App.ControlPanel.Engine.csproj'
            'App.ControlPanel\App.ControlPanel.WinForms.csproj'
            'Web\Web.csproj'
            'Tests.UnitTests\Tests.UnitTests.csproj'
            # Builds only because every project it references is now .NET 10. It was left on net48
            # during the port and so could not restore at all (NU1201) - a breakage nothing caught,
            # because it is the one project no other project references.
            'Tests.FakeDataGen\Tests.FakeDataGen.csproj'
          )

          $failed = @()
          foreach ($p in $projects) {
            Write-Host "::group::$p"
            dotnet build "src\AnalyticsEngine\$p" -c Release --nologo
            if ($LASTEXITCODE -ne 0) { $failed += $p }
            Write-Host "::endgroup::"
          }

          if ($failed.Count -gt 0) {
            Write-Host "::error::$($failed.Count) project(s) failed to build: $($failed -join ', ')"
            exit 1
          }

      - name: Start Redis
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile "$env:RUNNER_TEMP\redis.zip"
          Expand-Archive "$env:RUNNER_TEMP\redis.zip" -DestinationPath "$env:RUNNER_TEMP\redis"
          Start-Process -FilePath "$env:RUNNER_TEMP\redis\redis-server.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          & "$env:RUNNER_TEMP\redis\redis-cli.exe" ping

      # Hard gate, unlike the full suite below. These classes assert invariants that need no service
      # or credential, so a failure is always a real regression and must fail the job. Without this
      # they would be swallowed by the warning-only step that follows - and two of the things they
      # guard (the NLS setting, and 22 tests that spent the port excluded from the build) are exactly
      # the kind of thing that goes missing without anything turning red. Runs in about a second.
      - name: Check configuration, collation and API invariants
        shell: pwsh
        run: |
          dotnet test src\AnalyticsEngine\Tests.UnitTests\Tests.UnitTests.csproj `
            -c Release --no-build --nologo `
            --filter "FullyQualifiedName~ConfigurationSourceTests|FullyQualifiedName~UserSecretsConsistencyTests|FullyQualifiedName~ObjectByIdCacheCollationTests|FullyQualifiedName~AuthRequestRulesTests|FullyQualifiedName~LicenceActivityApiTests|FullyQualifiedName~LicenceActivityLoadHarnessTests|FullyQualifiedName~LicenceActivityReadModelCacheTests"

      # Guards the demo generator's entry point. Building it proves nothing about whether it RUNS:
      # the project's move to an SDK-style csproj added a target-framework folder to the output path
      # and silently invalidated the literal path Verify-DemoCommand.ps1 used to locate the exe.
      # Deliberately only `demo --help` rather than the full Verify-DemoCommand.ps1, which provisions
      # real LocalDB databases - too slow and too failure-prone for every push, while this catches the
      # class of breakage that actually occurred.
      - name: Smoke-test the demo data generator
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src\AnalyticsEngine\Tests.FakeDataGen\bin\Release" -Filter 'Tests.FakeDataGen.exe' -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Tests.FakeDataGen.exe was not produced by the build." }
          Write-Host "Found $exe"
          & $exe demo --help 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "demo --help exited $LASTEXITCODE" }

      - name: Run the unit tests
        shell: pwsh
        env:
          # Read-only public metadata; raises the anonymous GitHub API rate limit that
          # DownloadLatestReleaseZipsHaveContent would otherwise hit on a shared runner IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release only because that is what this workflow builds above; unlike tests.yml the choice
          # no longer carries configuration with it. Configuration used to come from App.config,
          # generated per build configuration from App.Template.config plus a transform, so a Debug
          # run on a runner had no configuration at all. The checked-in appsettings.json is
          # configuration-independent, and the secrets arrive as environment variables.
          dotnet test src\AnalyticsEngine\Tests.UnitTests\Tests.UnitTests.csproj `
            -c Release --nologo --logger "trx;LogFileName=net10.trx" --results-directory "$env:RUNNER_TEMP\testresults"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Unit tests reported failures - see the uploaded trx. Some tests need services this runner does not have."
          }
          # Deliberately not propagated: a job that is red by default is one nobody reads. The
          # build step above is the hard gate, and the trx keeps a genuine regression visible.
          exit 0

      # Uploaded for inspection only. Deliberately NOT named like a release artifact: nothing this
      # workflow produces may ever be mistaken for a customer download.
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: net10-test-results
          path: ${{ runner.temp }}/testresults/**/*.trx
          if-no-files-found: ignore
