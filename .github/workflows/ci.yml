name: Release build

on:
  push:
    branches: [main]
    paths:
      - src/AnalyticsEngine/**
      - src/SPO/**
      - reports/**
      - build/**
      - .nvmrc
      - .github/ci-paths.json
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Never cancel a release after signing, tagging or uploading has started.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup_build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.number.outputs.number }}
    steps:
      - name: Calculate build number
        id: number
        env:
          OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "number=$((OFFSET + RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  tests:
    uses: ./.github/workflows/tests.yml
    with:
      force_run: true
    secrets: inherit

  packages:
    needs: setup_build
    uses: ./.github/workflows/build-packages.yml
    with:
      build_label: Build ${{ needs.setup_build.outputs.build_number }}
      sign_installer: true
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup_build, tests, packages]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.setup_build.outputs.build_number }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: drop_*
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Resolve published stable baseline
        id: baseline
        run: |
          set -euo pipefail
          previous=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq 'map(select(.draft == false and .prerelease == false)) | first | .tag_name // empty')
          if [ -z "$previous" ]; then
            echo "::error::No published stable baseline was found; cannot prove the SQL asset delta."
            exit 1
          fi
          git rev-parse --verify "refs/tags/$previous^{commit}"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
      - name: Verify package contents
        shell: pwsh
        run: ./.github/scripts/Test-ReleasePackages.ps1 -Path "$env:RUNNER_TEMP/packages"
      - name: Export SQL assets and record checksums
        env:
          BASELINE: ${{ steps.baseline.outputs.tag }}
        run: node .github/scripts/prepare-release.mjs prepare "$BASELINE" "$RELEASE_COMMIT" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/release-assets"
      - name: Create verified release candidate
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          draft: true
          prerelease: ${{ github.ref_name != 'main' }}
          makeLatest: false
          name: ${{ github.ref_name == 'main' && 'Stable' || 'Testing' }} build ${{ env.RELEASE_TAG }}
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.baseline.outputs.tag }}
          artifacts: ${{ runner.temp }}/release-assets/*
          artifactErrorsFailBuild: true
      - name: Download candidate and verify every asset
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/downloaded-assets"
          node .github/scripts/prepare-release.mjs verify "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/downloaded-assets"
      - name: Publish only after verification
        if: vars.PUBLISH_RELEASES == 'true'
        env:
          IS_STABLE: ${{ github.ref_name == 'main' }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$IS_STABLE"
