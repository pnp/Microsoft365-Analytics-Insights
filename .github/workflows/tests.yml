name: Tests

on:
  # ci.yml calls this with force_run for the exact release SHA; no duplicate main push run.
  # Required checks must report even on unrelated PRs; gate work inside the workflow.
  pull_request:
    # The net10 branch has no XML configuration and builds on the .NET 10 SDK; its own
    # workflow (net10.yml) covers it. Running this .NET Framework pipeline against it would fail
    # on the App.config/Web.config transforms this file still performs.
    branches-ignore:
      - net10
    # `ready_for_review` alone is NOT enough. A pull request opened directly as non-draft emits
    # `opened`, never `ready_for_review`, so this workflow never started and the required checks
    # were never reported - leaving the PR permanently at mergeStateStatus BLOCKED and mergeable
    # only by an admin bypass, which skips the test suite outright. `synchronize` additionally
    # means pushing new commits to an open PR re-runs the tests. See issue #270.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # Deliberately NO `paths:` filter here.
    #
    # `test_dotnet (Release)` and `test_aitracker` are REQUIRED status checks on dev and main. A
    # workflow that never starts reports nothing at all, so a PR touching only (say)
    # src/TelemetryService/** would sit at BLOCKED for ever with zero statuses and again need an
    # admin bypass. Every PR must therefore start this workflow; the actual per-path gating is
    # applied per step inside the jobs below, so both required checks always report a real
    # success without running a build for an unrelated change.
  workflow_dispatch:
    inputs:
      force_run:
        default: false
        type: boolean
        description: Bypass code changed check
  workflow_call:
    inputs:
      force_run:
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  Storage: UseDevelopmentStorage=true
  REQUIRE_AZURITE: 'true'

jobs:
  setup_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      run_dotnet: ${{ inputs.force_run || steps.changes.outputs.dotnet == 'true' }}
      run_portal: ${{ inputs.force_run || steps.changes.outputs.portal == 'true' }}
      run_aitracker: ${{ inputs.force_run || steps.changes.outputs.aitracker == 'true' }}
      run_spfx: ${{ inputs.force_run || steps.changes.outputs.spfx == 'true' }}
      shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select dependent workloads
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: .github/ci-paths.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Define exhaustive test shards
        id: shards
        run: echo "matrix=$(node .github/scripts/ci.mjs)" >> "$GITHUB_OUTPUT"

  workflow_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test CI helpers
        run: node --test .github/scripts/*.test.mjs
      - name: Validate workflow syntax
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          cd "$RUNNER_TEMP"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -shellcheck=''

  test_aitracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup_tests
    steps:
      - name: Checkout source
        if: needs.setup_tests.outputs.run_aitracker == 'true' || needs.setup_tests.outputs.run_spfx == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check committed SPFx package
        if: needs.setup_tests.outputs.run_spfx == 'true'
        shell: pwsh
        run: ./.github/scripts/Test-SpfxPackage.ps1
      - name: Setup Node
        if: needs.setup_tests.outputs.run_aitracker == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/SPO/AITracker/TypeScript/package-lock.json
      - name: Run AI Tracker tests
        if: needs.setup_tests.outputs.run_aitracker == 'true'
        working-directory: src/SPO/AITracker/TypeScript
        run: npm ci && npm run test

  build_tests:
    runs-on: windows-2022
    timeout-minutes: 30
    needs: setup_tests
    if: needs.setup_tests.outputs.run_dotnet == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/AnalyticsEngine/Web/Scripts/portal/package-lock.json
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.config', '**/packages.lock.json', '**/NuGet.Config', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Only synthetic configuration enters the downloadable binary artifact.
      - name: Configure credential-free test binaries
        uses: devops-actions/variable-substitution@452ffbbfb1c26fd5d9aaf24faffb59c5084257e9 # v2.0.0
        with:
          files: src/AnalyticsEngine/Tests.UnitTests/App.Release.config
        env:
          ClientID: 00000000-0000-0000-0000-000000000000
          TenantGUID: 00000000-0000-0000-0000-000000000000
          TenantDomain: contoso.onmicrosoft.com
          ClientSecret: ''
          CognitiveEndpoint: ''
          CognitiveKey: ''
          ServiceBus: ''
      - name: Restore and build test binaries
        shell: pwsh
        run: |
          msbuild src\AnalyticsEngine\Tests.UnitTests\Tests.UnitTests.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed.' }
          msbuild src\AnalyticsEngine\Tests.FakeDataGen\Tests.FakeDataGen.csproj /restore /p:Configuration=Release /p:BuildProjectReferences=false
          if ($LASTEXITCODE -ne 0) { throw 'Demo generator build failed.' }
      - name: Upload reusable test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-binaries
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
          path: |
            src/AnalyticsEngine/Tests.UnitTests/bin/Release
            src/AnalyticsEngine/Tests.FakeDataGen/bin/Release

  test_shards:
    name: .NET tests (${{ matrix.name }})
    runs-on: windows-2022
    timeout-minutes: 45
    needs: [setup_tests, build_tests]
    if: needs.setup_tests.outputs.run_dotnet == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup_tests.outputs.shards) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-binaries
          path: src/AnalyticsEngine
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/test-runtime
      - name: Configure this runner only
        uses: devops-actions/variable-substitution@452ffbbfb1c26fd5d9aaf24faffb59c5084257e9 # v2.0.0
        with:
          files: src/AnalyticsEngine/Tests.UnitTests/bin/Release/Tests.UnitTests.dll.config
        env:
          ClientID: ${{ secrets.APP_CLIENTID }}
          ClientSecret: ${{ secrets.APP_CLIENTSECRET }}
          TenantGUID: ${{ secrets.APP_TENANTGUID }}
          TenantDomain: ${{ secrets.APP_TENANTDOMAIN }}
          CognitiveEndpoint: ${{ secrets.APP_COGNITIVEENDPOINT }}
          CognitiveKey: ${{ secrets.APP_COGNITIVEKEY }}
          ServiceBus: ${{ secrets.CONNECTIONSTRINGS_SERVICEBUS }}
      - name: Execute every test assigned to this shard
        shell: pwsh
        env:
          TEST_FILTER: ${{ matrix.filter }}
          SHARD: ${{ matrix.name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $vstest = Join-Path $vs 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe'
          & $vstest src\AnalyticsEngine\Tests.UnitTests\bin\Release\Tests.UnitTests.dll `
            "/TestCaseFilter:$env:TEST_FILTER" "/Logger:trx;LogFileName=$env:SHARD.trx" `
            "/ResultsDirectory:$env:RUNNER_TEMP\test-results" /Platform:x64
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Report test outcomes and durations
        if: always()
        shell: pwsh
        env:
          SHARD: ${{ matrix.name }}
        run: ./.github/scripts/Write-TestSummary.ps1 -ResultsDirectory "$env:RUNNER_TEMP\test-results" -Name $env:SHARD
      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vs-test-result-logs-${{ matrix.name }}
          retention-days: 7
          path: ${{ runner.temp }}/test-results/*.trx
          if-no-files-found: error
      - name: Smoke-test the shipped demo executable
        if: matrix.name == 'demo'
        shell: pwsh
        run: ./src/AnalyticsEngine/Tests.FakeDataGen/Verify-DemoCommand.ps1 -Configuration Release

  test_portal:
    name: Portal type checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup_tests
    if: needs.setup_tests.outputs.run_portal == 'true'
    defaults:
      run:
        working-directory: src/AnalyticsEngine/Web/Scripts/portal
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/AnalyticsEngine/Web/Scripts/portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:tests
      # Includes the complete i18n suite; neither language is optional.
      - run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=portal-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: portal-test-results
          retention-days: 7
          path: src/AnalyticsEngine/Web/Scripts/portal/portal-results.xml
          if-no-files-found: error

  # Keep the protected status context exactly as it was before splitting the work.
  test_dotnet:
    name: test_dotnet (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup_tests, workflow_checks, build_tests, test_shards, test_portal]
    if: always() && needs.setup_tests.result != 'skipped'
    steps:
      - name: Require every applicable check
        env:
          SETUP: ${{ needs.setup_tests.result }}
          HELPERS: ${{ needs.workflow_checks.result }}
          RUN_DOTNET: ${{ needs.setup_tests.outputs.run_dotnet }}
          BUILD: ${{ needs.build_tests.result }}
          SHARDS: ${{ needs.test_shards.result }}
          RUN_PORTAL: ${{ needs.setup_tests.outputs.run_portal }}
          PORTAL: ${{ needs.test_portal.result }}
        run: |
          test "$SETUP" = success
          test "$HELPERS" = success
          if [ "$RUN_DOTNET" = true ]; then
            test "$BUILD" = success
            test "$SHARDS" = success
          fi
          if [ "$RUN_PORTAL" = true ]; then
            test "$PORTAL" = success
          fi
